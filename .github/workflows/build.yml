name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Yline.zip

      - name: Fix minSdk
        run: sed -i 's/minSdk 21/minSdk 23/' Yline/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: Yline
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Yline-debug-apk
          path: Yline/app/build/outputs/apk/debug/*.apk
